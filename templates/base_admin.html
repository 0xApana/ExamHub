<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ExamHub Admin{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<nav class="bg-slate-900 shadow text-white">

    <div class="max-w-7xl mx-auto px-8 py-5 flex justify-between items-center">

        <h1 class="text-3xl font-bold">
            ExamHub Admin
        </h1>

        <div class="flex gap-4">

            <a href="{{ url_for('admin_dashboard') }}"
               class="hover:text-blue-300">
                Dashboard
            </a>

            <a href="{{ url_for('admin_questions') }}"
               class="hover:text-blue-300">
                Questions
            </a>

            <form method="POST" action="{{ url_for('logout') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<button type="submit"
               class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded">Logout</button>
</form>

        </div>

    </div>

</nav>

<div class="max-w-7xl mx-auto py-10 px-8">

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="bg-green-100 text-green-700 p-4 rounded mb-6">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
