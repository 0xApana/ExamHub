{% extends "base_admin.html" %}

{% block title %}
{{ "Edit Question" if question else "Add Question" }}
{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow">

    <h1 class="text-3xl font-bold mb-6">
        {{ "Edit Question" if question else "Add Question" }}
    </h1>

    <form method="POST">

        <label class="font-semibold">Course</label>

        <select
            name="course"
            class="w-full border rounded-lg p-3 mb-4"
            required>

            <option
                value="Applied Electricity II"
                {% if question and question["course"]=="Applied Electricity II" %}selected{% endif %}>
                Applied Electricity II
            </option>

            <option
                value="Engineering Mathematics II"
                {% if question and question["course"]=="Engineering Mathematics II" %}selected{% endif %}>
                Engineering Mathematics II
            </option>

        </select>

        <label class="font-semibold">Year</label>

        <input
            type="text"
            name="year"
            value="{{ question['year'] if question else '' }}"
            class="w-full border rounded-lg p-3 mb-4"
            required>

        <label class="font-semibold">Question</label>

        <textarea
            name="question"
            rows="4"
            class="w-full border rounded-lg p-3 mb-4"
            required>{{ question["question"] if question else "" }}</textarea>

        <label class="font-semibold">Option A</label>

        <input
            type="text"
            name="option_a"
            value="{{ question['option_a'] if question else '' }}"
            class="w-full border rounded-lg p-3 mb-4"
            required>

        <label class="font-semibold">Option B</label>

        <input
            type="text"
            name="option_b"
            value="{{ question['option_b'] if question else '' }}"
            class="w-full border rounded-lg p-3 mb-4"
            required>

        <label class="font-semibold">Option C</label>

        <input
            type="text"
            name="option_c"
            value="{{ question['option_c'] if question else '' }}"
            class="w-full border rounded-lg p-3 mb-4"
            required>

        <label class="font-semibold">Option D</label>

        <input
            type="text"
            name="option_d"
            value="{{ question['option_d'] if question else '' }}"
            class="w-full border rounded-lg p-3 mb-4"
            required>

        <label class="font-semibold">Correct Answer</label>

        <select
            name="correct_answer"
            class="w-full border rounded-lg p-3 mb-6"
            required>

            <option
                value="A"
                {% if question and question["correct_answer"]=="A" %}selected{% endif %}>
                A
            </option>

            <option
                value="B"
                {% if question and question["correct_answer"]=="B" %}selected{% endif %}>
                B
            </option>

            <option
                value="C"
                {% if question and question["correct_answer"]=="C" %}selected{% endif %}>
                C
            </option>

            <option
                value="D"
                {% if question and question["correct_answer"]=="D" %}selected{% endif %}>
                D
            </option>

        </select>

        <button
            type="submit"
            class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg">

            {{ "Update Question" if question else "Save Question" }}

        </button>

    </form>

</div>

{% endblock %}
