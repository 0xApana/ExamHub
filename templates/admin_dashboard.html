<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-100">

<nav class="bg-slate-900 text-white shadow">

<div class="max-w-7xl mx-auto px-8 py-5 flex justify-between">

<h1 class="text-3xl font-bold">

ExamHub Admin

</h1>

<a
href="{{ url_for('logout') }}"
class="bg-red-600 hover:bg-red-700 px-5 py-2 rounded">

Logout

</a>

</div>

</nav>

<div class="max-w-7xl mx-auto py-10 px-8">

<h2 class="text-4xl font-bold mb-8">

Dashboard

</h2>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

<div class="bg-white rounded-xl shadow p-8">

<h3 class="text-gray-500">

Students

</h3>

<p class="text-5xl font-bold mt-3">

{{ total_students }}

</p>

</div>

<div class="bg-white rounded-xl shadow p-8">

<h3 class="text-gray-500">

Questions

</h3>

<p class="text-5xl font-bold mt-3">

{{ total_questions }}

</p>

</div>

<div class="bg-white rounded-xl shadow p-8">

<h3 class="text-gray-500">

Courses

</h3>

<p class="text-5xl font-bold mt-3">

{{ total_courses }}

</p>

</div>

<div class="bg-white rounded-xl shadow p-8">

<h3 class="text-gray-500">

Results

</h3>

<p class="text-5xl font-bold mt-3">

{{ total_results }}

</p>

</div>

</div>

</div>


<div class="mt-10">

    <a
        href="{{ url_for('admin_questions') }}"
        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg">

        Manage Questions

    </a>

</div>


</body>
</html>
