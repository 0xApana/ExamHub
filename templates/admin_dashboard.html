{% extends "base_admin.html" %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<h2 class="text-4xl font-bold mb-8">
    Dashboard
</h2>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

    <div class="bg-white rounded-xl shadow p-8">
        <h3 class="text-gray-500">Students</h3>
        <p class="text-5xl font-bold mt-3">{{ total_students }}</p>
    </div>

    <div class="bg-white rounded-xl shadow p-8">
        <h3 class="text-gray-500">Questions</h3>
        <p class="text-5xl font-bold mt-3">{{ total_questions }}</p>
    </div>

    <div class="bg-white rounded-xl shadow p-8">
        <h3 class="text-gray-500">Courses</h3>
        <p class="text-5xl font-bold mt-3">{{ total_courses }}</p>
    </div>

    <div class="bg-white rounded-xl shadow p-8">
        <h3 class="text-gray-500">Results</h3>
        <p class="text-5xl font-bold mt-3">{{ total_results }}</p>
    </div>

</div>

{% endblock %}
