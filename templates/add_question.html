{% extends "base_admin.html" %}

{% block title %}
Add Question
{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow">

    <h1 class="text-3xl font-bold mb-6">
        Add Question
    </h1>

    <form method="POST">

        <label class="font-semibold">Course</label>

        <select
            name="course"
            class="w-full border rounded-lg p-3 mb-4"
            required>

            <option value="Applied Electricity II">
                Applied Electricity II
            </option>

            <option value="Engineering Mathematics II">
                Engineering Mathematics II
            </option>

        </select>

        <label class="font-semibold">Year</label>

        <input
            type="text"
            name="year"
            class="w-full border rounded-lg p-3 mb-4"
            required>

        <label class="font-semibold">Question</label>

        <textarea
            name="question"
            rows="4"
            class="w-full border rounded-lg p-3 mb-4"
            required></textarea>

        <label class="font-semibold">Option A</label>

        <input
            type="text"
            name="option_a"
            class="w-full border rounded-lg p-3 mb-4"
            required>

        <label class="font-semibold">Option B</label>

        <input
            type="text"
            name="option_b"
            class="w-full border rounded-lg p-3 mb-4"
            required>

        <label class="font-semibold">Option C</label>

        <input
            type="text"
            name="option_c"
            class="w-full border rounded-lg p-3 mb-4"
            required>

        <label class="font-semibold">Option D</label>

        <input
            type="text"
            name="option_d"
            class="w-full border rounded-lg p-3 mb-4"
            required>

        <label class="font-semibold">Correct Answer</label>

        <select
            name="correct_answer"
            class="w-full border rounded-lg p-3 mb-6"
            required>

            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>

        </select>

        <button
            type="submit"
            class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg">

            Save Question

        </button>

    </form>

</div>

{% endblock %}
